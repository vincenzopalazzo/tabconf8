f2ecbc5da19873287b117588804fefd?network=mainnet</div><div class="num">23</div></section><section class="slide m" data-n="24"><h1>You just published <span class="a">your history.</span></h1><div class="small">docs.arkadeos.com/wallets/getting-started/arkade-addresses · docs.spark.money/wallets/privacy</div><div class="num">24</div></section><section class="slide l mono" data-n="25"><h1>₿you@domain → <span class="a">lno1…</span></h1><div class="small">blinded paths · a fresh invoice per payer · no public ledger of Lightning payments</div><div class="num">25</div></section><section class="slide l" data-n="26"><h1>Same name. <span class="a">Swappable plumbing.</span></h1><div class="small">Phoenix → CLN → LDK → Spark / Ark (once they receive offers) · the name never changes</div><div class="num">26</div></section><section class="slide l" data-n="27"><h1>Contacts. Names. Receipts.</h1><div class="num">27</div></section><section class="slide xl" data-n="28"><h1>Watch.</h1><div class="num">28</div></section><section class="slide xl" data-n="29"><h1>(fallback video)</h1><div class="num">29</div></section><section class="slide l" data-n="30"><h1>Already in production.</h1><div class="num">30</div></section><section class="slide l" data-n="31"><h1>Your product, on top.</h1><div class="num">31</div></section><section class="slide l" data-n="32"><h1>Ark already pays offers.</h1><div class="small">Second · bark: Wallet::pay_lightning_offer (Ark → Lightning gateway)</div><div class="num">32</div></section><section class="slide l" data-n="33"><h1>Spark: you&#x27;re one step away.</h1><div class="num">33</div></section><section class="slide xl" data-n="34"><h1><span class="a">One</span> interface.</h1><div class="num">34</div></section><section class="slide xl" data-n="35"><h1>Three steps.</h1><div class="num">35</div></section><section class="slide xl" data-n="36"><h1><span class="a">1.</span> Pay offers.</h1><div class="small">CLN: xpay / fetchinvoice · LDK Node: bolt12_payment().send() · LND: LNDK</div><div class="num">36</div></section><section class="slide l" data-n="37"><h1><span class="a">2.</span> Receive offers.</h1><div class="small">CLN: offer · LDK Node: bolt12_payment().receive() · LND: LNDK v0.3</div><div class="num">37</div></section><section class="slide l" data-n="38"><h1><span class="a">3.</span> ₿you@yourdomain</h1><div class="small">BIP-353 · TXT at &lt;user&gt;.user._bitcoin-payment.&lt;domain&gt; → bitcoin:?lno=… (an offer, not a layer address)</div><div class="num">38</div></section><section class="slide xl" data-n="39"><h1>Links.</h1><div class="links">github.com/lightning/bolts/blob/master/12-offer-encoding.md<br>github.com/bitcoin/bips/blob/master/bip-0353.mediawiki<br>github.com/lightning/blips/blob/master/blip-0042.md<br>lightningdevkit.org<br>github.com/lightningdevkit/ldk-node<br>docs.corelightning.org<br>github.com/lndk-org/lndk<br>bolt12.org</div><div class="num">39</div></section><section class="slide l" data-n="40"><h1>Make payments <span class="a">just work.</span></h1><div class="num">40</div></section><section class="slide l" data-n="41"><h1>Pretty straightforward, <span class="a">right?</span></h1><div class="num">41</div></section></template>

const ME=Math.random().toString(36).slice(2),CH='tabconf-bolt12-deck';let PEERS=[],bc=null;
try{bc=new BroadcastChannel(CH)}catch(e){}
function sendSync(n){const m={t:'tabconf-go',n:n,src:ME,ts:Date.now()};try{bc&&bc.postMessage(m)}catch(e){}
 try{localStorage.setItem(CH,JSON.stringify(m))}catch(e){}
 PEERS.forEach(w=>{try{if(w&&!w.closed)w.postMessage(m,'*')}catch(e){}})}
function onSync(f){const h=m=>{if(m&&m.t==='tabconf-go'&&m.src!==ME&&Number.isInteger(m.n))f(m.n)};
 if(bc)bc.onmessage=e=>h(e.data);
 addEventListener('storage',e=>{if(e.key===CH&&e.newValue){try{h(JSON.parse(e.newValue))}catch(_){}}});
 addEventListener('message',e=>h(e.data))}

const D=[{"head": "Bolt12 is the new common interface to Bitcoin payments", "sec": "Hook", "cue": "Title card. Black. 'common interface' in accent. Small footer with the slot.", "notes": "Walk on, say the title, pause. I'm Vincenzo, I work on Core Lightning and LDK, mostly BOLT 12. This is the long version of my August X article 'We Are Making the Same Mistake Again'. I'm not here to tell anyone their product is wrong. I'm here to recruit you."}, {"head": "Open a channel.", "sec": "Hook", "cue": "One line per slide, fast cuts (slides 2-5 in about 20 seconds).", "notes": "Remember early Lightning? This is what we asked users to do."}, {"head": "Rebalance it.", "sec": "Hook", "cue": "Same layout.", "notes": "Beat."}, {"head": "Wait for gossip.", "sec": "Hook", "cue": "Same layout.", "notes": "Beat."}, {"head": "Payment failed.", "sec": "Hook", "cue": "Accent on 'failed.' Hold it.", "notes": "And after all that, payments often still failed. That was our mistake, the Lightning community's. I'm part of it. We exposed the machinery to the user."}, {"head": "We spent years hiding that.", "sec": "Problem: a shared mistake we can avoid", "cue": "Plain.", "notes": "LSPs, better pathfinding, splicing. A lot of people in this room did that work. That's how we got to the 'payments just work' era."}, {"head": "Users never see the plumbing.", "sec": "Problem: a shared mistake we can avoid", "cue": "Accent on 'never'. This line comes back at the end.", "notes": "That's the lesson we paid for. Good payments hide the machinery."}, {"head": "More layers than ever.", "sec": "Problem: a shared mistake we can avoid", "cue": "Small grey row under it: LSPs · Spark · Ark · ecash · …", "notes": "This is good news. Spark, Ark, LSPs and ecash are real engineering that make holding and moving bitcoin easier. More options are a good thing."}, {"head": "“Powered by ___”", "sec": "Problem: a shared mistake we can avoid", "cue": "A blank badge. Don't name or shame anyone.", "notes": "Every new layer has the same natural temptation: tell the user which technology they're on. We did it too ('Lightning-enabled!'). It's not a sin. It's just the same mistake again: it asks the user to care about the plumbing."}, {"head": "Which protocol does your bank speak?", "sec": "Problem: a shared mistake we can avoid", "cue": "Plain question. Let it hang.", "notes": "When you send a wire across the world, you never check what protocol the other bank speaks. There's a common identifier, and everything underneath competes and improves freely."}, {"head": "The interface is shared.", "sec": "Problem: a shared mistake we can avoid", "cue": "Accent on 'shared'.", "notes": "Banks compete on everything except the account number. That's what lets them all win."}, {"head": "When one piece breaks…", "sec": "Problem: a shared mistake we can avoid", "cue": "Plain. Optional: only use a real #whenlightning screenshot if you have one.", "notes": "On 3 August, Boltz suspended all swaps after months of AI-assisted attacks on its infrastructure. Boltz is non-custodial, so no user funds were at risk, and the losses were Boltz's own. But wallets that routed Lightning through Boltz, like Bull Bitcoin and Aqua, lost Lightning payments overnight. On 13 August the founders handed the project to a new team. As of 5 Oct, swaps are still offline (re-check on the morning of 14 Oct). Say it kindly: this can happen to any of us. A shared interface is everyone's backup plan."}, {"head": "spark is great, until it's not.", "sec": "Problem: a shared mistake we can avoid", "cue": "Screenshot of the @stutxo tweet under the headline. Warm, not a jab.", "notes": "Real community quote, not a pile-on. Read it once, pause. Gateways are useful until they aren't \u2014 same pattern as Boltz. Bridge: that's why wallets should be ship-independent at the edge with Bolt12. Source: https://x.com/stutxo/status/2107190138497564950"}, {"head": "A shared mistake. A shared fix.", "sec": "Problem: a shared mistake we can avoid", "cue": "Accent on 'A shared fix.'", "notes": "So it's not 'Lightning versus Spark versus Ark'. It's one interface on top, and everyone's product underneath."}, {"head": "Bolt12 is the account number.", "sec": "Thesis", "cue": "THE thesis slide. Biggest type in the deck.", "notes": "Bolt12 is the closest thing we have to an IBAN, an account number for Bitcoin. We keep missing it because it's too simple to explain."}, {"head": "lno1…", "sec": "Thesis", "cue": "Huge monospace 'lno1' plus a dim tail where your REAL demo offer string goes.", "notes": "An offer is a static, reusable payment request that lives natively on Lightning. It's merged in the BOLTs as BOLT 12."}, {"head": "Publish once.", "sec": "Thesis", "cue": "Grey line under the title: Check the blinded path before the tattoo.", "notes": "Put it on a website, a Nostr profile, a tip jar, a printed QR at a coffee shop, a mining pool page. Joke beat: check the blinded path before you tattoo the offer — once it's inked, that introduction path is part of the permanent string."}, {"head": "Pay forever.", "sec": "Thesis", "cue": "Accent on 'forever.'", "notes": "The payer's wallet asks for a fresh invoice over onion messages, gets one that can use blinded paths for privacy, and pays."}, {"head": "No web server.", "sec": "Thesis", "cue": "Two small struck-through words: 'expiring BOLT11'  'LNURL server'.", "notes": "No single-use invoice that expires, and no HTTP server that has to stay online. It all happens on the Lightning network itself."}, {"head": "Any backend.", "sec": "Thesis", "cue": "Plain. The bridge to 'your product on top'.", "notes": "And the person paying doesn't need to know what you run underneath: channels, an LSP, Spark, Ark, whatever comes next."}, {"head": "Between the layers.", "sec": "Thesis", "cue": "Accent on 'Between'. Small grey row: Lightning · Spark · Ark · LSPs · ecash  →  one lno1…", "notes": "This is the new beat. Bolt12 isn't just an interface to Lightning. It's the common interface between the layers. Lightning, Spark, Ark and whatever comes next all sit behind one offer and one name. The layers compete underneath, and the interface stays shared on top."}, {"head": "₿you@domain → ark1…", "sec": "Thesis", "cue": "Monospace. Under it, small dim mono: the literal ark1… address (a real mainnet Arkade address, from a public explorer page). Footer: the arkade.space tx link. Don't name the owner; it's a pattern, not a person or a product.", "notes": "BIP-353 is great: a human name in DNS. The temptation is to put your layer's native address behind it, like an Arkade ark1… address. This one is real, straight off arkade.space. An Arkade address encodes the operator's server key plus your taproot output key. Paste it into the explorer: one transaction, then the address page lists every VTXO it ever received. This one: 10 VTXOs, about 909k sats received in total, all public. (Checked 5 Oct 2026.) It's one reusable, correlatable identifier."}, {"head": "₿you@domain → spark1…", "sec": "Thesis", "cue": "Same layout as the slide before, a fast cut. Small dim mono: the literal spark1… address. Footer: the sparkscan.io tx link. Again, don't name the owner.", "notes": "Same story on Spark. This spark1… address is real too, off sparkscan.io. A Spark address maps to your wallet's identity key. Spark's docs say new wallets start with privacy off, so anyone can query their Bitcoin balance and transfer history. A privacy mode exists, but it covers Bitcoin only, and token activity stays public. This example is exactly that: a 79 USDB token transfer, and the address page shows its whole history of sends, swaps and counterparties. Keep it kind: most Spark wallets don't show users these addresses today. Let's not start doing it in DNS."}, {"head": "You just published your history.", "sec": "Thesis", "cue": "Accent on 'your history.' Hold it. Optional, only if you have one: a blurred explorer screenshot of a TEST address you own.", "notes": "If that identifier sits behind your public name, anyone who resolves the name learns which layer and which operator you use. They can paste the address into an explorer and link your payments together. You didn't publish a payment request. You published an activity surface. Same mistake again: exposing the plumbing, and this time it's the user's privacy that leaks, not just UX. Keep it kind: 'we'd all do this by default. It's the easy path.'"}, {"head": "₿you@domain → lno1…", "sec": "Thesis", "cue": "Monospace. Accent on 'lno1…'. Small grey line: 'blinded paths · fresh invoice per payment · no public ledger of Lightning payments'.", "notes": "Now put a Bolt12 offer behind the same name. The offer can hide the receiving node behind blinded paths. Every payer gets a fresh invoice over onion messages, and Lightning has no public ledger to paste it into. Honest caveat: the offer is still a static, reusable string, and the introduction node and your LSP or gateway can see payments. So this is 'much less public', not 'perfectly private'."}, {"head": "Same name. Swappable plumbing.", "sec": "Thesis", "cue": "Accent on 'Swappable plumbing.' Small grey line: 'Phoenix → CLN → LDK → Spark → Ark · the name never changes'.", "notes": "And here's the part that matters for business. Behind the name, you can move from Phoenix to your own CLN node, to an LSP, and tomorrow to a Spark- or Ark-backed receiver. You only update the DNS record to the new offer. Payers keep typing the same name, and nobody watching learns which plumbing you moved to. Be honest: today the swap works between Lightning backends. Spark and Ark can join the moment they receive offers. That's the ask. Expose Bolt12 in BIP-353, not your layer address."}, {"head": "Contacts. Names. Receipts.", "sec": "Proof / live demo", "cue": "Three words. Accent on none, keep it calm.", "notes": "Contacts: save an offer under a name once and pay with one tap (bLIP-42). Names: BIP-353 puts the offer behind ₿name@domain, using DNSSEC and no web server. Receipts: payer proofs give the sender a verifiable receipt (my spec work, bolts#1346, merged into the BOLTs on 27 Jul 2026)."}, {"head": "Watch.", "sec": "Proof / live demo", "cue": "Full-screen phone mirror + one terminal pane. Fallback video ready on the next slide.", "notes": "LIVE DEMO, about 4 minutes, following demo-runbook.md. 1) Show the QR. 2) Phoenix pays it with a message. 3) Pay the SAME QR again, from a second wallet if you can, and show two different invoices for one offer. 4) Type ₿name@domain and pay again. Rule: if any step takes longer than 45 seconds, switch to the video."}, {"head": "(fallback video)", "sec": "Proof / live demo", "cue": "Embedded local MP4 of the full demo, recorded at the venue on 12–13 Oct. Skip this slide if the live demo works.", "notes": "Only if the live demo fails: 'The network's fine. The conference Wi-Fi isn't. Here's the same thing from yesterday.'"}, {"head": "Already in production.", "sec": "Proof / live demo", "cue": "Small credit line: OCEAN pool payouts · Phoenix · Strike · Core Lightning · LDK · Eclair.", "notes": "OCEAN pays miners to Bolt12 offers (announced April 2024; Lightning payouts paused during the chain split and resumed 4 Sep 2026). Phoenix has paid and received offers since v2.3.1 (July 2024). Strike has paid offers via LNDK since August 2024. CLN, LDK and Eclair ship it in production."}, {"head": "Your product, on top.", "sec": "Proof / live demo", "cue": "Plain. Respectful, inviting.", "notes": "This is the pitch to the builders here. You don't have to change your architecture. Expose Bolt12 at the edge."}, {"head": "Ark already pays offers.", "sec": "Proof / live demo", "cue": "Small source line: Second / bark: Wallet::pay_lightning_offer.", "notes": "Second's bark wallet pays BOLT12 offers from an Ark balance through the Ark server's Lightning gateway (bark API: pay_lightning_offer, since bark MR !807, Jul 2025; it even pays Phoenix offers). That's exactly the pattern: your layer underneath, the common interface on top. Thank them. Say 'Second's Ark' if asked: Arkade, the other Ark implementation, documents BOLT11-only Lightning sends right now. Receiving to an offer isn't documented for bark yet. The ask: when you add BIP-353 names, put an offer in the record, not an ark1… address."}, {"head": "Spark: you're one step away.", "sec": "Proof / live demo", "cue": "Plain. Warm, not a jab.", "notes": "Spark's own research piece says Spark balances can pay BOLT12 offers through the SSP. But the public Spark SDK docs only document BOLT11 (payLightningInvoice), and the Breez Spark SDK, which Breez now recommends to all its partners, still lists Bolt12 as unchecked. So a lot of wallets will soon run on Spark. Bolt12 on Spark would bring all of them in at once. Offer to help: 'Pay and receive offers, and I'll help.' Don't say Spark lacks it; say it isn't in the public SDK yet. Then the privacy ask: 'If you give users ₿names, put a Bolt12 offer behind them, not a spark1… address. Your users keep their history to themselves, and you stay swappable.'"}, {"head": "One interface.", "sec": "Proof / live demo", "cue": "Accent on 'One'. The four backends from earlier collapse into a single 'lno1…'.", "notes": "Reprise of 'Between the layers.' Channels, LSPs, Spark, Ark: the user only ever needs the offer, or the name that points to it. The name is public. The plumbing stays private and swappable."}, {"head": "Three steps.", "sec": "Call to action for builders", "cue": "Plain. Now speak to builders directly.", "notes": "If you build a wallet, an exchange, a service or a layer, here's the order I'd do it in."}, {"head": "1. Pay offers.", "sec": "Call to action for builders", "cue": "Accent on '1.' Tiny footer: CLN xpay / fetchinvoice · LDK Node bolt12_payment().send · LNDK for LND.", "notes": "Cheapest first step, and your users can immediately pay every Phoenix user, OCEAN-style payout, tip jar and merchant offer."}, {"head": "2. Receive offers.", "sec": "Call to action for builders", "cue": "Accent on '2.' Tiny footer: CLN offer · LDK Node bolt12_payment().receive · LNDK (LND).", "notes": "Give every user one static, reusable offer. With an LSP or a gateway, your users don't need to run a node."}, {"head": "3. ₿you@yourdomain", "sec": "Call to action for builders", "cue": "Accent on '3.' Tiny footer: BIP-353 (DNSSEC TXT at user.user._bitcoin-payment.domain).", "notes": "Put the offer behind a name your users can say out loud. The name resolves through DNSSEC, with no LNURL server. One rule: in the DNS record, expose the Bolt12 offer, not your layer's address. Name public, plumbing private."}, {"head": "Links.", "sec": "Call to action for builders", "cue": "Small mono list: bolts 12-offer-encoding.md · BIP-353 · blip-0042 · lightningdevkit.org · ldk-node · docs.corelightning.org · lndk · bolt12.org", "notes": "Leave this up for a few seconds and tell people to photograph it. Offer to pair with any team during Builder Days or in the hallway."}, {"head": "Make payments just work.", "sec": "Call to action for builders", "cue": "Accent on 'just work.' Then hold.", "notes": "Hide the complexity. Users never see the plumbing. Make payments just work."}, {"head": "Pretty straightforward, right?", "sec": "Call to action for builders", "cue": "Closing line from the article. Footer: QR of YOUR offer + ₿name for questions/tips during Q&A.", "notes": "End on the article's last line. Leave your own offer and name on screen during Q&A."}];
const T=[...document.getElementById('slides').content.querySelectorAll('.slide')];
const $=id=>document.getElementById(id);
let i=0,t0=null,aw=null;
function put(frame,k){const st=frame.querySelector('.stage');st.innerHTML='';if(k<T.length){const c=T[k].cloneNode(true);c.classList.add('on');st.appendChild(c)}}
function fit(){document.querySelectorAll('.frame').forEach(f=>f.querySelector('.stage').style.transform='scale('+(f.clientWidth/1920)+')')}
function show(n){i=Math.max(0,Math.min(T.length-1,n));const d=D[i];
 put($('curF'),i);put($('nextF'),i+1);
 $('pos').textContent='Slide '+(i+1)+' / '+T.length;$('sec').textContent=d.sec;
 $('curHead').textContent='NOW: '+d.head;$('cue').textContent='Cue: '+d.cue;$('notes').textContent=d.notes;$('notesBox').scrollTop=0;
 $('nextHead').textContent=i+1<T.length?D[i+1].head:'— end of deck —';
 history.replaceState(null,'','#'+(i+1));if(i>0&&t0===null)t0=Date.now()}
const go=n=>{show(n);sendSync(i)};
function openAudience(){const path=location.pathname.replace(/\/dev(?:\/index\.html)?\/?$/,'/index.html');aw=window.open(path+'#'+(i+1),'tabconf-audience');PEERS=[aw]}
document.addEventListener('keydown',e=>{const k=e.key;
 if(['ArrowRight','ArrowDown','PageDown',' '].includes(k)){e.preventDefault();go(i+1)}
 else if(['ArrowLeft','ArrowUp','PageUp'].includes(k)){e.preventDefault();go(i-1)}
 else if(k==='Home')go(0);else if(k==='End')go(T.length-1);
 else if(k==='p'||k==='P')openAudience();
 else if(k==='t'||k==='T')t0=Date.now();
 else if(k==='+'||k==='='||k==='-'){let v=parseFloat(getComputedStyle($('notes')).fontSize)+(k==='-'?-2:2);v=Math.max(14,Math.min(64,v));document.body.style.setProperty('--nfs',v+'px');try{localStorage.setItem('tabconf-nfs',v)}catch(_){}}});
$('prev').onclick=e=>{e.currentTarget.blur();go(i-1)};$('next').onclick=e=>{e.currentTarget.blur();go(i+1)};$('open').onclick=e=>{e.currentTarget.blur();openAudience()};
try{const v=localStorage.getItem('tabconf-nfs');if(v)document.body.style.setProperty('--nfs',v+'px')}catch(_){}
function tick(){const p=x=>String(x).padStart(2,'0');const now=new Date();$('clock').textContent=p(now.getHours())+':'+p(now.getMinutes());
 const s=t0===null?0:Math.floor((Date.now()-t0)/1000);$('timer').textContent=p(Math.floor(s/60))+':'+p(s%60)}
setInterval(tick,500);tick();
new ResizeObserver(fit).observe($('grid'));addEventListener('resize',fit);
addEventListener('hashchange',()=>show((parseInt(location.hash.slice(1))||1)-1));
onSync(show);
show((parseInt(location.hash.slice(1))||1)-1);fit();
</script></body></html>
